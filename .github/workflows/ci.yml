name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: Flow.Launcher.Plugin.Shorty

      # Shorty.csproj references Flow.Launcher.Plugin as a sibling checkout.
      # Pinned to the fork branch that carries the preview-pane APIs
      # (PreviewContentType.Markdown, RoundedIcon, StartLoadingBar).
      - name: Checkout Flow.Launcher
        uses: actions/checkout@v4
        with:
          repository: TrueCrimeDev/Flow.Launcher
          ref: markdown-preview-pane
          path: Flow.Launcher

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build
        run: dotnet build Flow.Launcher.Plugin.Shorty/Shorty/Shorty.csproj -c Release

      - name: Test
        run: dotnet test Flow.Launcher.Plugin.Shorty/Shorty.Tests/Shorty.Tests.csproj -c Release
