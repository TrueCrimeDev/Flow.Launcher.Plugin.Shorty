body:
  - type: passwordBox
    attributes:
      name: api_key
      label: "API key:"
      defaultValue: ""
      description: OpenAI-compatible bearer token. Stored in plain text in Flow's settings.

  - type: input
    attributes:
      name: base_url
      label: "Base URL:"
      defaultValue: https://api.openai.com/v1
      description: OpenAI-compatible endpoint, no trailing slash. Examples - https://api.openai.com/v1, https://openrouter.ai/api/v1, http://localhost:11434/v1

  - type: input
    attributes:
      name: default_model
      label: "Default model:"
      defaultValue: gpt-5.5-instant
      description: Model name passed in the request body. Per-preset overrides may live in presets.json.

  - type: input
    attributes:
      name: default_preset
      label: "Default preset:"
      defaultValue: default
      description: Preset name to use when the first word of your query doesn't match any preset.

  - type: input
    attributes:
      name: request_timeout
      label: "Request timeout (seconds):"
      defaultValue: "60"
      description: HTTP timeout for the streaming request.
